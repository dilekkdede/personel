<div class="page-head">
  <div>
    <h2>Şehirler</h2>
    <p>Personel kayıtlarında kullanılacak şehir listesi.</p>
  </div>
  <p-button *ngIf="auth.isAdmin()" label="Yeni şehir" icon="pi pi-plus" (onClick)="showDialog()"></p-button>
</div>

<div class="panel">
  <p-table [value]="sehirler" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 20, 50]">
    <ng-template pTemplate="header">
      <tr>
        <th>Şehir</th>
        <th>Plaka</th>
        <th>Durum</th>
        <th>Oluşturma</th>
        <th *ngIf="auth.isAdmin()">İşlem</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-city>
      <tr>
        <td>{{ city.name }}</td>
        <td>{{ city.code }}</td>
        <td>{{ city.status }}</td>
        <td>{{ city.createDate | date: 'dd.MM.yyyy HH:mm' }}</td>
        <td *ngIf="auth.isAdmin()" class="actions">
          <p-button label="Düzenle" icon="pi pi-pencil" [text]="true" (onClick)="editCity(city)"></p-button>
          <p-button label="Sil" icon="pi pi-trash" [text]="true" severity="danger"
                    (onClick)="confirmDelete($event, city.id)"></p-button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="auth.isAdmin() ? 5 : 4" class="empty">Henüz şehir yok. Yeni şehir ile ekle.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [header]="isEditButton ? 'Şehir düzenle' : 'Yeni şehir'" [modal]="true" [(visible)]="visible"
          appendTo="body" [dismissableMask]="true" [style]="{width: '28rem'}">
  <div class="form-stack">
    <div>
      <label>Şehir adı *</label>
      <input pInputText [(ngModel)]="cityName"/>
    </div>
    <div>
      <label>Plaka kodu *</label>
      <input pInputText [(ngModel)]="cityCode"/>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <p-button label="İptal" severity="secondary" [outlined]="true" (onClick)="cancel()"></p-button>
    <p-button *ngIf="!isEditButton" label="Kaydet" [loading]="saving" (onClick)="saveCity()"></p-button>
    <p-button *ngIf="isEditButton" label="Güncelle" [loading]="saving" (onClick)="updateCity()"></p-button>
  </ng-template>
</p-dialog>
