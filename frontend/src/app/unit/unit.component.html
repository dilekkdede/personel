<div class="page-head">
  <div>
    <h2>Birimler</h2>
    <p>Organizasyon birimleri. Personel kaydı bunlardan birine bağlanır.</p>
  </div>
  <p-button *ngIf="auth.isAdmin()" label="Yeni birim" icon="pi pi-plus" (onClick)="showDialog()"></p-button>
</div>

<div class="panel">
  <p-table [value]="birimler" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 20, 50]">
    <ng-template pTemplate="header">
      <tr>
        <th>Ad</th>
        <th>Kod</th>
        <th>Oluşturma</th>
        <th *ngIf="auth.isAdmin()">İşlem</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-unit>
      <tr>
        <td>{{ unit.name }}</td>
        <td>{{ unit.code }}</td>
        <td>{{ unit.createDate | date: 'dd.MM.yyyy HH:mm' }}</td>
        <td *ngIf="auth.isAdmin()" class="actions">
          <p-button label="Düzenle" icon="pi pi-pencil" [text]="true" (onClick)="editUnit(unit)"></p-button>
          <p-button label="Sil" icon="pi pi-trash" [text]="true" severity="danger"
                    (onClick)="confirmDelete($event, unit.id)"></p-button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="auth.isAdmin() ? 4 : 3" class="empty">Henüz birim yok. Yeni birim ile ekle.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [header]="isEditButton ? 'Birim düzenle' : 'Yeni birim'" [modal]="true" [(visible)]="visible"
          appendTo="body" [dismissableMask]="true" [style]="{width: '28rem'}">
  <div class="form-stack">
    <div>
      <label>Birim adı *</label>
      <input pInputText [(ngModel)]="unitName"/>
    </div>
    <div>
      <label>Birim kodu *</label>
      <input pInputText [(ngModel)]="unitCode"/>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <p-button label="İptal" severity="secondary" [outlined]="true" (onClick)="cancel()"></p-button>
    <p-button *ngIf="!isEditButton" label="Kaydet" [loading]="saving" (onClick)="saveUnit()"></p-button>
    <p-button *ngIf="isEditButton" label="Güncelle" [loading]="saving" (onClick)="updateUnit()"></p-button>
  </ng-template>
</p-dialog>
