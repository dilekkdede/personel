spring.application.name=personel

# Bu proje Apinizer / is makinesinden ayri durur. 8080 kullanma.
server.port=${SERVER_PORT:18080}

# Sifre ve local DB bilgisi application-local.properties icinde (Git'e girmez).
spring.profiles.active=local

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Git'e girebilecek varsayilanlar: host/port/db adi. Sifre burada yok.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:personel_dev}
spring.datasource.username=${DB_USERNAME:postgres}

jwt.secret=${JWT_SECRET:change-this-local-secret-key-min-32-chars!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
